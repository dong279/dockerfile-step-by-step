# ==========================================================
# [GKE 심화: Secret Sync] (기본 방법에서는 사용하지 않음, README 의 "심화" 참고)
# SecretSync: Secret Manager 값 → Kubernetes Secret 자동 생성
#
#   Secret Manager (openai-api-key)
#      │  21-rag-openai-spc.yaml (무엇을)  +  20-rag-serviceaccount.yaml (누구 권한으로)
#      ▼
#   Kubernetes Secret "rag-openai" (키: OPENAI_API_KEY)   ← metadata.name 이 곧 Secret 이름
#      ▼
#   10-rag-deployment.yaml 의 secretKeyRef { name: rag-openai, key: OPENAI_API_KEY } (minikube 와 같은 Deployment)
#
# - 클러스터에서 Secret Sync 기능을 켜야 동작: gcloud container clusters update ... --enable-secret-sync
# - Secret Manager 에서 키를 바꿨을 때 자동 반영하려면 --enable-secret-sync-rotation (기본 2분마다 확인)
#   단, 앱은 환경 변수를 시작할 때만 읽으므로 반영 후 kubectl rollout restart deploy/rag -n rag
# - 상태 확인: kubectl describe secretsync rag-openai -n rag
# ==========================================================
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: rag-openai                     # 만들어질 Kubernetes Secret 의 이름
  namespace: rag
spec:
  serviceAccountName: rag-sa           # 20-rag-serviceaccount.yaml
  secretProviderClassName: rag-openai-spc   # 21-rag-openai-spc.yaml
  secretObject:
    type: Opaque
    data:
      - sourcePath: "openai-api-key.txt"    # 21 의 path
        targetKey: "OPENAI_API_KEY"         # Kubernetes Secret 안의 키 (Deployment 가 읽는 키)
