# ==========================================================
# [GKE 심화: Secret Sync] (기본 방법에서는 사용하지 않음, README 의 "심화" 참고)
# Secret Manager 를 읽을 Kubernetes ServiceAccount
#
# - 22-rag-openai-secretsync.yaml 의 SecretSync 가 이 계정의 권한으로 Secret Manager 를 읽음
# - 이 계정 자체에는 비밀번호나 키가 없음. 대신 Google Cloud IAM 에서 이 계정(namespace rag, 이름 rag-sa)에
#   "openai-api-key 를 읽어도 된다(roles/secretmanager.secretAccessor)" 는 권한을 줌 (Workload Identity)
#     gcloud secrets add-iam-policy-binding openai-api-key \
#       --role=roles/secretmanager.secretAccessor \
#       --member=principal://iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/ns/rag/sa/rag-sa
# ==========================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-sa
  namespace: rag
