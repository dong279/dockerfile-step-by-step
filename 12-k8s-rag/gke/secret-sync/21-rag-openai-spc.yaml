# ==========================================================
# [GKE 심화: Secret Sync] (기본 방법에서는 사용하지 않음, README 의 "심화" 참고)
# SecretProviderClass: Secret Manager 의 어떤 값을 가져올지
#
# - provider: gke  → GKE 가 관리하는 Secret Manager 연동 사용
# - resourceName   → Secret Manager 의 비밀 이름과 버전
#                    ⚠ <PROJECT_ID> 를 내 프로젝트 ID 로 바꾸기
#                    versions/latest: 항상 최신 버전 (키를 바꾸면 새 버전을 추가)
# - path           → 22-rag-openai-secretsync.yaml 이 이 이름(sourcePath)으로 값을 찾음
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rag-openai-spc
  namespace: rag
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/<PROJECT_ID>/secrets/openai-api-key/versions/latest"
        path: "openai-api-key.txt"
