# ==========================================================
# Namespace: RAG 앱 전용 이름공간
# - 메모 앱(memo)과 분리해 두면 한 클러스터에서 함께 실행하고, 따로 지울 수 있음
#     kubectl delete namespace rag   ← RAG 앱 리소스만 전부 삭제
# ==========================================================
apiVersion: v1
kind: Namespace
metadata:
  name: rag
