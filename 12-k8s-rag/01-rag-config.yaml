# ==========================================================
# ConfigMap: 비밀이 아닌 앱 설정
# - 10-ec2-deploy 의 .env 에서 비밀이 아닌 값만 옮김
# - GRADIO_SERVER_NAME(0.0.0.0), GRADIO_SERVER_PORT(7860), PYTHONUNBUFFERED 는
#   이미지(Dockerfile 의 ENV)에 이미 들어 있으므로 여기서 다시 넣지 않음
# - 값을 바꾼 뒤에는 Pod 를 다시 만들어야 적용됨:
#     kubectl rollout restart deploy/rag -n rag
# ==========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag
data:
  # PDF 업로드 최대 크기 (코드의 [변경 6], 큰 PDF 는 Pod 메모리와 임베딩 비용이 커짐)
  APP_MAX_FILE_SIZE: "20mb"
