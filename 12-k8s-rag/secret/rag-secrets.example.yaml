# ==========================================================
# Secret 예시 파일 2개 (OpenAI 키, 로그인 계정)
#
# ⚠ 이 파일은 일부러 secret/ 폴더에 따로 두었습니다.
#   - kubectl apply -f 12-k8s-rag/ 는 하위 폴더를 적용하지 않으므로, 예시 값이 실제 Secret 을 덮어쓰지 않음
#
# Secret 을 둘로 나눈 이유
#   - rag-openai : OpenAI 키 (GKE 에서는 Secret Manager 에 원본을 두고 gcloud 로 꺼내서 만듦)
#   - rag-secret : 로그인 계정
#   → 키는 Secret Manager 에서 다시 만들고, 로그인 계정은 따로 바꿀 수 있게 분리
#     (심화의 Secret Sync 를 쓸 때도 자동 생성되는 rag-openai 와 손으로 만드는 rag-secret 이 섞이지 않음)
#
# 만드는 방법 (권장): 파일 없이 명령으로 (키가 파일로 남지 않음)
#   # minikube: 키를 직접 입력
#   kubectl create secret generic rag-openai -n rag --from-literal=OPENAI_API_KEY='sk-...'
#   # GKE (또는 minikube 에서도): Secret Manager 에 저장한 키를 꺼내서
#   kubectl create secret generic rag-openai -n rag \
#     --from-literal=OPENAI_API_KEY="$(gcloud secrets versions access latest --secret=openai-api-key)"
#   # minikube, GKE 모두
#   kubectl create secret generic rag-secret -n rag --from-literal=APP_USERNAME='admin' --from-literal=APP_PASSWORD='긴_비밀번호'
#
# 이 파일을 쓰려면: 복사해서 값을 넣고 적용 (rag-secrets.yaml 은 Git 에 올리지 않기, .gitignore)
#   cp secret/rag-secrets.example.yaml secret/rag-secrets.yaml
#   kubectl apply -f secret/rag-secrets.yaml
# ==========================================================
apiVersion: v1
kind: Secret
metadata:
  name: rag-openai
  namespace: rag
type: Opaque
stringData:
  # OpenAI API 키 (이 클러스터 전용 키를 만들고, OpenAI 플랫폼에서 월 사용 한도를 정해 두기)
  OPENAI_API_KEY: "sk-여기에_발급받은_키_입력"
---
apiVersion: v1
kind: Secret
metadata:
  name: rag-secret
  namespace: rag
type: Opaque
stringData:
  # 로그인 계정 (둘 다 있어야 로그인 화면이 켜짐)
  APP_USERNAME: "admin"
  APP_PASSWORD: "여기에_긴_비밀번호_입력"
