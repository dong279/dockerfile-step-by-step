# ==========================================================
# [6단계] PVC (PersistentVolumeClaim): "디스크 1GB 를 빌려 주세요" 라는 요청서
#
# 5단계까지의 문제
#   - DB 데이터가 컨테이너 안에만 있어서 Pod 가 다시 만들어지면 메모가 모두 사라짐
#
# PVC 를 쓰면
#   - Pod 와 상관없이 오래 남는 저장 공간(PV, PersistentVolume)을 받아서 Pod 에 연결
#   - Pod 를 지우고 다시 만들어도 같은 PV 에 다시 연결 → 데이터 유지
#   - compose 의 이름 있는 볼륨(mariadb-data)과 같은 역할
#
# 동작 순서 (동적 프로비저닝)
#   PVC 생성 → StorageClass(기본값)가 PV 를 자동으로 만듦 → PVC 와 PV 연결(Bound) → Pod 가 사용
#   - Docker Desktop: 기본 StorageClass "hostpath" (내 PC 디스크 사용)
#   - 확인: kubectl get storageclass, kubectl get pvc,pv -n memo
#
# ⚠ kubectl delete namespace memo 를 하면 PVC 도 지워지고, 보통 PV 와 데이터도 함께 삭제됨
#   (compose 의 docker compose down -v 와 같음)
# ==========================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: memo
spec:
  accessModes:
    - ReadWriteOnce          # 한 노드에서만 읽기/쓰기 (DB 는 Pod 1개만 쓰므로 이것으로 충분)
  resources:
    requests:
      storage: 1Gi           # 요청할 크기
  # storageClassName 을 적지 않으면 클러스터의 기본 StorageClass 사용
