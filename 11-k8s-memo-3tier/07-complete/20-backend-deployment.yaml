# ==========================================================
# [7단계] 백엔드 Deployment: 완성본 (5단계 + initContainer + probe + resources)
#
# 6단계와 달라진 점
#   - initContainers: MariaDB 가 준비될 때까지 기다린 뒤 앱 시작 (compose 의 depends_on 역할)
#   - startupProbe / readinessProbe / livenessProbe: Spring Boot Actuator 의 상태 확인 주소 사용
#   - resources: 메모리 한도 (JAVA_TOOL_OPTIONS 의 MaxRAMPercentage 가 이 한도를 기준으로 힙 크기를 정함)
#   - replicas: 2 → Service 가 두 Pod 에 요청을 나눠 줌, 하나가 재시작돼도 서비스 유지
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: memo
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # [7단계] 본 컨테이너보다 "먼저" 실행되고, 성공해야 본 컨테이너가 시작됨
      initContainers:
        - name: wait-for-mariadb
          image: mariadb:10.11.18      # mariadb-admin 명령을 쓰려고 같은 이미지 사용 (이미 받아 둔 이미지라 빠름)
          command:
            - sh
            - -c
            - |
              # mariadb Service 가 응답할 때까지 3초마다 확인
              # (mariadb 의 readinessProbe 가 통과해야 Service 가 연결되므로 "준비된 DB" 를 기다리는 셈)
              until mariadb-admin ping -h "$DB_HOST" -P "$DB_PORT" --silent; do
                echo "waiting for $DB_HOST:$DB_PORT ..."
                sleep 3
              done
              echo "mariadb is ready"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: memo-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: memo-config, key: DB_PORT }

      containers:
        - name: backend
          # ⚠ hubusername 을 내 Docker Hub 아이디로 바꾸기
          image: hubusername/boot-flyway-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: memo-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: memo-config, key: DB_PORT }
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef: { name: memo-config, key: MARIADB_DATABASE }
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef: { name: memo-config, key: MARIADB_USER }
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: memo-secret, key: MARIADB_PASSWORD }
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
            # [7단계] Actuator 의 probe 전용 주소 켜기 (application.properties 를 고치지 않고 환경 변수로 설정)
            #   /actuator/health/liveness  : 앱 자체가 살아 있는지 (DB 상태는 보지 않음)
            #   /actuator/health/readiness : 요청을 받을 수 있는지 (아래 설정으로 DB 연결 상태까지 포함)
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
              value: "readinessState,db"

          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits:   { memory: 768Mi }

          # Spring Boot 는 시작에 수십 초가 걸리므로 startupProbe 로 넉넉히 기다림
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36      # 5초 × 36번 = 최대 3분 (Flyway 마이그레이션 포함)
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          # liveness 에 DB 상태를 넣지 않는 이유:
          #   DB 가 잠깐 끊겼을 때 백엔드까지 재시작되면 오히려 복구가 늦어짐 (readiness 로 요청만 막으면 충분)
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
            failureThreshold: 3
