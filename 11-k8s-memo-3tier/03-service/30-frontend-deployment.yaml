# ==========================================================
# [3단계] React 클라이언트 (nginx, Docker Hub 이미지)
#
# - nginx 가 /api, /actuator 요청을 BACKEND_URL 로 전달 (경로 그대로)
# - nginx 는 시작할 때 "backend" 주소를 찾으므로 backend Service 가 먼저 있어야 함
#   (파일 이름 번호 순서 21 → 30 으로 적용되므로 OK, 없으면 host not found in upstream 오류)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: memo
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # ⚠ hubusername 을 내 Docker Hub 아이디로 바꾸기
          image: hubusername/boot-flyway-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://backend:8080"   # ← 백엔드 Service 이름 (compose 에서는 app:8080 이었음)
