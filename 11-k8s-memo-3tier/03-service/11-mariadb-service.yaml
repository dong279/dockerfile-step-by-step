# ==========================================================
# [3단계] Service: Pod 앞에 붙이는 "고정 주소"
#
# - Pod 는 다시 만들어질 때마다 IP 가 바뀌지만, Service 의 이름과 IP 는 바뀌지 않음
# - 같은 Namespace 안의 다른 Pod 는 "mariadb:3306" 으로 접속
#   (compose 에서 서비스 이름 mariadb 로 접속하던 것과 같은 효과)
# - Service 는 selector 의 이름표(app: mariadb)가 붙은 Pod 로 요청을 전달
#
# type: ClusterIP (기본값)
#   - 클러스터 "안"에서만 접속 가능 → DB 는 외부에 공개하지 않음
#   - compose 에서 DB 포트를 인터넷에 열지 않았던 것과 같은 이유
# ==========================================================
apiVersion: v1
kind: Service
metadata:
  name: mariadb                # ← 이 이름이 곧 접속 주소 (백엔드의 DB_HOST)
  namespace: memo
spec:
  type: ClusterIP
  selector:
    app: mariadb               # 이 이름표가 붙은 Pod 로 전달
  ports:
    - port: 3306               # Service 가 받는 포트 (mariadb:3306)
      targetPort: 3306         # Pod 컨테이너의 포트
