# ==========================================================
# [3단계, 변경 없음] 프론트엔드 Service (NodePort): 클러스터 밖(내 PC 브라우저)에서 접속
#
# type: NodePort
#   - 클러스터의 노드(내 PC)에 30000~32767 범위의 포트를 열어 Service 로 연결
#   - Docker Desktop Kubernetes: http://localhost:30080
#   - 다른 환경(minikube, kind 등)은 README 의 "접속 방법" 참고 (kubectl port-forward 는 어디서나 동작)
#
# 포트 3개의 의미
#   nodePort   30080 : 내 PC 에서 접속하는 포트
#   port          80 : 클러스터 안에서 Service 로 접속하는 포트 (frontend:80)
#   targetPort    80 : Pod 안 nginx 가 듣는 포트
# ==========================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: memo
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
