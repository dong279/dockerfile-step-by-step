# ==========================================================
# [5단계] Secret: 비밀번호처럼 숨겨야 하는 값
#
# 4단계의 문제
#   - 비밀번호가 Deployment YAML 에 그대로 보이고, 같은 값을 mariadb / backend 두 곳에 적어야 함
#
# Secret 으로 옮기면
#   - 비밀번호는 여기서만 관리하고, Deployment 는 secretKeyRef 로 참조만 함
#   - kubectl get / describe 에 값이 바로 표시되지 않음
#   - 권한(RBAC)으로 "Secret 은 읽지 못하게" 따로 막을 수 있음
#
# ⚠ 주의: Secret 은 "암호화"가 아니라 base64 "인코딩"
#   - kubectl get secret memo-secret -o yaml 로 보이는 값은 누구나 base64 -d 로 되돌릴 수 있음
#   - 그래서 실제 비밀번호를 넣은 이 파일은 Git 에 올리지 않기 (또는 아래 kubectl create secret 명령 사용)
#
# stringData: 평문으로 쓰면 Kubernetes 가 저장할 때 base64 로 바꿔 줌 (data: 에는 base64 값을 직접 넣어야 함)
#
# 같은 Secret 을 파일 없이 명령으로 만드는 방법
#   kubectl create secret generic memo-secret -n memo \
#     --from-literal=MARIADB_ROOT_PASSWORD='루트용_긴_비밀번호' \
#     --from-literal=MARIADB_PASSWORD='앱용_비밀번호'
# ==========================================================
apiVersion: v1
kind: Secret
metadata:
  name: memo-secret
  namespace: memo
type: Opaque                       # 일반 키-값 Secret
stringData:
  # ⚠ 실습 전에 다른 값으로 바꾸기
  MARIADB_ROOT_PASSWORD: "change-me-root-1234"   # MariaDB root (mariadb 에만 전달)
  MARIADB_PASSWORD: "change-me-boot-1234"        # boot 계정 (mariadb, backend 에 전달)
# data:
#   MARIADB_ROOT_PASSWORD: "Y2hhbmdlLW1lLXJvb3QtMTIzNA=="   # change-me-root-1234
#   MARIADB_PASSWORD: "Y2hhbmdlLW1lLWJvb3QtMTIzNA=="        # change-me-boot-1234