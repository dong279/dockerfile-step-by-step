# ==========================================================
# [2단계] Deployment: "이런 Pod 를 항상 N개 유지해 줘"
#
# 1단계와 달라진 점
#   - Pod 를 직접 만들지 않고, Deployment 가 template 을 보고 Pod 를 만듦
#   - Pod 가 죽거나 지워지면 Deployment 가 새 Pod 를 자동으로 다시 만듦 (자동 복구)
#   - replicas 로 개수 조절, 이미지를 바꾸면 Pod 를 순서대로 교체 (롤링 업데이트)
#
# 구조: Deployment → ReplicaSet(개수 관리) → Pod
#   kubectl get deploy,rs,pods -n memo 로 세 가지를 함께 볼 수 있음
#
# 아직 남은 문제
#   - Pod 가 다시 만들어지면 이름과 IP 가 바뀜 → 다른 Pod 가 접속할 주소가 없음 → 3단계 Service
#   - Pod 가 다시 만들어지면 DB 데이터가 사라짐                              → 6단계 PVC
# ==========================================================
apiVersion: apps/v1            # Deployment 는 apps 그룹의 v1
kind: Deployment
metadata:
  name: mariadb                # Deployment 이름
  namespace: memo
  labels:
    app: mariadb               # Deployment 자신을 구분하는 레이블 이름 
spec:
  replicas: 1                  # 유지할 Pod 개수 (DB 는 1개: 여러 개면 데이터가 따로 놀게 됨)

  # 어떤 Pod 를 "내 Pod" 로 관리할지 (아래 template.metadata.labels 와 반드시 같아야 함)
  selector:
    matchLabels:
      app: mariadb            # Deployment가 관리할 Pod를 고르는 조건

  # Pod 를 만들 때 쓰는 설계도 (1단계 Pod YAML 의 metadata + spec 과 거의 같음)
  template:
    metadata:
      labels:
        app: mariadb           # ← selector 와 같은 값, Pod 자신의 레이블 이름
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11.18
          ports:
            - containerPort: 3306
          env:
            # ⚠ 실습용: 비밀번호를 그대로 적음 (5단계에서 Secret 으로 옮김)
            - name: MARIADB_ROOT_PASSWORD
              value: "root-pass-1234"
            - name: MARIADB_DATABASE
              value: "boot_db"
            - name: MARIADB_USER
              value: "boot"
            - name: MARIADB_PASSWORD
              value: "boot-pass-1234"
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
